[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyapt"
version = "0.0.7"
requires-python = ">=3.14"
authors = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
maintainers = [
	{ name = "Mark Veltzer", email = "mark.veltzer@gmail.com" }
]
description = "module to help you maintain third party apt repos in a sane way"
readme = "README.md"
license = "MIT"
keywords=[
    "pyapt",
    "apt",
    "apt-key",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "pytconf",
    "pylogconf",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "sphinx",
]

[project.urls]
"Homepage" = "https://github.com/veltzer/pyapt"
"Bug Tracker" = "https://github.com/veltzer/pyapt/issues"
"Documentation" = "https://veltzer.github.io/pyapt"
"Download" = "https://pypi.org/project/pyapt/"
"Repository" = "https://github.com/veltzer/pyapt"

[tool.ruff]
line-length = 130

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyapt"]

[tool.hatch.build.targets.sdist]
include = [
    "src/pyapt/",
    "README.md",
    "LICENSE",
    "pyproject.toml"
]
exclude = [
    ".gitignore",
    ".github/",
    "tests/",
    "docs/",
    "config/",
    "*.md",
]

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor). preset = "legacy" is
# pyrefly's mypy-compatible behavior; "." on the search path is mypy's
# implicit current directory.
preset = "legacy"
python-version = "3.14"
search-path = [
    "src",
    ".",
]

[tool.pyrefly.errors]
no-any-return = "error"

[tool.hatch.envs.default]
installer = "uv"

[tool.uv.pip]
prerelease = "disallow"
